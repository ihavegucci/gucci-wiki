# Зона ограничения частоты запросов к /api/auth/* (логин/регистрация) —
# защита от перебора паролей и спама регистраций (QA-прогон 2, отчёт по
# отказоустойчивости). Не шаблон (без __DOMAIN__/__PORT__) — limit_req_zone
# обязана быть объявлена в http{}-контексте один раз; use (limit_req
# zone=...) — в location внутри http-only.conf.template/with-ssl.conf.template.
# conf.d/*.conf подключается внутри общего http{} — порядок файлов в conf.d
# не важен, nginx строит единый http-контекст из всех include до применения
# директив.
#
# $binary_remote_addr — ключ по IP (компактнее $remote_addr в памяти зоны).
# 10m зоны — достаточно на десятки тысяч уникальных IP.
# 5r/m — 5 запросов в минуту на IP в среднем; burst (задаётся в location)
# сглаживает всплеск легитимных повторных попыток без открытия для перебора.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
